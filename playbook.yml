---
- name: Configure application server
  hosts: webservers
  become: true
  roles:
    - geerlingguy.docker
    - geerlingguy.certbot
    - geerlingguy.nginx

  tasks:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Enable Certbot renewal timer
      ansible.builtin.systemd_service:
        name: certbot.timer
        state: started
        enabled: true

    - name: Configure Nginx reload after certificate renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: |
          #!/bin/sh
          systemctl reload nginx
        owner: root
        group: root
        mode: '0755'

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Allow HTTP and HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Deny incoming connections by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing connections by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW
      community.general.ufw:
        state: enabled

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded